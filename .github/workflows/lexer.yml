# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Lexer
on: [push, pull_request]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y llvm-18-tools
      - run: make -j2 test-lexer
        env:
          LIT: /usr/lib/llvm-18/build/utils/lit/lit.py
          FILECHECK: /usr/lib/llvm-18/bin/FileCheck

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-llvm
      - run: python -m pip install lit==18.1.8
      - shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT\ucrt64\bin;$env:PATH"
          mingw32-make -j2 test-lexer LIT=lit
