[package]
name = "Shuttle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "shuttle"
path = "src/main.rs"

[dependencies]
dunce = "1"
fs2 = "0.4.3"
kdl = "6"
object = { version = "0.37", default-features = false, features = ["read_core", "coff", "elf", "macho", "unaligned"] }
unicode-ident = "1"
unicode-normalization = "0.1"
